# Local Development Environment
# Ports: backend=8000, frontend=3000
# Network: dev-net
#
# `name:` pins the Compose project name regardless of which directory you
# invoke `docker compose` from. Without it, running from a git worktree like
# .claude/worktrees/<random-name>/ would auto-derive a different project name,
# and volume names would drift (e.g. `jolly-aryabhata-f0e6ad_agent-team-data`).
# That breaks the supervisor's external-volume binding, which has to know the
# volume name up front. Pinning the project name keeps everything stable.
#
# Override with COMPOSE_PROJECT_NAME=foo if you intentionally want an
# isolated dev environment (env var wins over `name:` at the file level).
name: agent-team-dev

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: dev
    container_name: agent-team-backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./config:/app/config
      - ./tests:/app/tests
      - ./demo:/app/demo
      # supervisor/ is mounted read-only so backend tests can import judge.py
      # to verify the cross-container contract (strategy field shape, terminal
      # state names, etc.). The backend never executes supervisor code — this
      # is purely for tests/test_deployment_judge.py.
      - ./supervisor:/app/supervisor:ro
      # frontend/ is bind-mounted so the CodeWriter's local writes
      # (src/core/code_writer.py::_parse_and_write_files) reach the host
      # filesystem. Without this mount, agent edits to frontend/src/**
      # only land in the backend container's in-image FS and never become
      # visible to the frontend container or to Vite HMR.
      - ./frontend:/app/frontend
      # docs/ is mounted from the MAIN repo (not the worktree) so research
      # artifacts land at C:\ai-projects\claude-agent-team\docs\research\... —
      # the natural project root, instead of being buried in .claude\worktrees.
      # Any worktree-local doc edits won't be visible to the running container;
      # commit them to a branch first to make them accessible.
      - C:/ai-projects/claude-agent-team/docs:/app/docs
      # KB-06 — CLAUDE.md (conventions) mounted read-only so the platform-corpus
      # reindex can ingest it into the "Platform" knowledge bucket.
      - C:/ai-projects/claude-agent-team/CLAUDE.md:/app/CLAUDE.md:ro
      # PM-finalize feature — when a user clicks "Finalize PRD" or "Finalize
      # Tasks" we write the markdown to C:/ai-projects/<ProjectName>/docs/
      # on the host. The backend writes through this mount; inside the
      # container the path is /host/ai-projects/<ProjectName>/docs/. The
      # project-name validation rejects spaces and filesystem-unsafe chars
      # (see src/core/project_validation.py::validate_name) so the path is
      # safe to construct by string concat.
      - C:/ai-projects:/host/ai-projects
      # `data` switched from named volume to host bind-mount so the supervisor
      # running on the HOST (not in Docker — see CLAUDE.md "Supervisor scope")
      # can read SQLite directly without needing Docker volume gymnastics.
      # `reports` and `backups` stay as named volumes — they're write-only
      # caches the host doesn't need to read.
      - ./data:/app/data
      - agent-team-reports:/app/reports
      - agent-team-backups:/app/backups
      # KB-13a — fastembed ONNX model cache. The local embedding model
      # (~130 MB) downloads once from HuggingFace and persists here, so
      # restarts don't re-download. Survives across worktrees (named volume).
      - agent-team-fastembed:/app/.fastembed_cache
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      # Allow MOCK agent mode (fake output) when no LLM credentials are set, so
      # local dev works without Claude Platform on AWS creds. Real creds, if
      # present, always win. NEVER set this in staging/prod (those hard-fail).
      - ALLOW_MOCK_MODE=${ALLOW_MOCK_MODE:-true}
      # HAI-17/18/54 — outbound push bridge. Set PUSH_WEBHOOK_URL (a Hermes
      # inbound webhook) in .env to forward request.failed / request.completed /
      # deploy_health.anomaly_detected. Empty = off (Hermes uses scheduled pull).
      - PUSH_WEBHOOK_URL=${PUSH_WEBHOOK_URL:-}
      - PUSH_WEBHOOK_SECRET=${PUSH_WEBHOOK_SECRET:-}
      - PUSH_EVENTS=${PUSH_EVENTS:-}
      # Claude Platform on AWS — see docs/setup-claude-platform-on-aws.md.
      # ANTHROPIC_AWS_API_KEY and ANTHROPIC_AWS_WORKSPACE_ID come from .env.
      - AWS_REGION=${AWS_REGION:-us-east-1}
      # KB-01 — Knowledge Base datastore. Backend reaches Postgres at the
      # service hostname `postgres` on dev-net. Defaults match the postgres
      # service below; override in .env.
      - KB_PG_HOST=${KB_PG_HOST:-postgres}
      - KB_PG_PORT=${KB_PG_PORT:-5432}
      - KB_PG_USER=${KB_PG_USER:-agentteam}
      - KB_PG_PASSWORD=${KB_PG_PASSWORD:-change-me-in-dev}
      - KB_PG_DB=${KB_PG_DB:-agentteam_kb}
      # KB-13a — local embedding model cache dir (persisted on the
      # agent-team-fastembed volume).
      - FASTEMBED_CACHE_PATH=/app/.fastembed_cache
    networks:
      - dev-net
    # KB-01 — wait for Postgres to accept connections before boot. The backend
    # still degrades gracefully if the KB is unavailable at runtime (NFR-007),
    # but ordering the dependency avoids a noisy first boot.
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ── KB-01 — Knowledge Base datastore: PostgreSQL 16 + pgvector ──────────
  # Single container; pgvector is an extension INSIDE Postgres, not a separate
  # service. Holds the agentic KB (kb_documents/kb_chunks/decision_ledger) and
  # vector embeddings. Data persists in a NAMED volume (not a host bind mount):
  # unlike the SQLite file, nothing on the host needs to read Postgres directly,
  # and bind-mounting PG's data dir to a Windows path causes permission/locking
  # grief. The platform's own state stays on SQLite (./data) — this is additive.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-team-postgres
    environment:
      - POSTGRES_USER=${KB_PG_USER:-agentteam}
      - POSTGRES_PASSWORD=${KB_PG_PASSWORD:-change-me-in-dev}
      - POSTGRES_DB=${KB_PG_DB:-agentteam_kb}
    volumes:
      - agent-team-pgdata:/var/lib/postgresql/data
    networks:
      - dev-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KB_PG_USER:-agentteam} -d ${KB_PG_DB:-agentteam_kb}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      target: dev
    container_name: agent-team-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json
      - ./frontend/components.json:/app/components.json
    networks:
      - dev-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── HAI-06 — agent-team-mcp: the MCP server Hermes connects to ──────────
  # Thin MCP adapter over the backend REST API (streamable-HTTP, FR-002). On
  # dev-net so it reaches the backend at the service hostname `backend:8000`;
  # port 9000 is published so a Hermes instance on the host can connect to
  # http://localhost:9000/mcp. AGENT_TEAM_SERVICE_TOKEN is minted via
  # POST /api/v1/service-tokens and set in .env (empty until then — the server
  # still starts; the adapter just can't authenticate yet).
  agent-team-mcp:
    build:
      context: ./mcp_server
      dockerfile: Dockerfile
    container_name: agent-team-mcp
    ports:
      - "9000:9000"
    volumes:
      # Bind-mount the source for dev (deps stay in the image's site-packages).
      - ./mcp_server:/app
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=9000
      - AGENT_TEAM_BACKEND_URL=http://backend:8000
      - AGENT_TEAM_SERVICE_TOKEN=${AGENT_TEAM_SERVICE_TOKEN:-}
    networks:
      - dev-net
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # The /mcp endpoint returns 406 to a bare GET, so probe the TCP port
      # instead — "is the server listening" is the right liveness signal.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9000), 3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  # agent-team-data is now bind-mounted to ./data (see backend.volumes above)
  agent-team-reports:
  agent-team-backups:
  agent-team-pgdata:   # KB-01 — Postgres + pgvector data (named volume)
  agent-team-fastembed:  # KB-13a — local embedding model cache (fastembed ONNX)

networks:
  dev-net:
    name: agent-team-dev
