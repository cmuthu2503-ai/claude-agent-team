# agent-team-mcp tool manifest (HAI-08 / FR-005, FR-008, NFR-007).
#
# Declares the tools the server exposes to Hermes and the MINIMUM role each
# requires. The server registers tools from THIS file (no hardcoding) and only
# those at or below its own resolved role (resolved via
# GET /api/v1/service-tokens/me). Monitor tools (HAI-10..16) and gated action
# tools (HAI-33+) are appended here as they're implemented in tool_impls.py.
#
# Each entry:
#   name:        the MCP tool name Hermes sees (grouped: monitor_* / project_* / ops_*)
#   description: shown to Hermes for tool selection / filtering
#   min_role:    viewer | developer | admin
#   method:      GET (reads are ungated) | POST | ... (informational; impl decides)
#   path:        the backend /api/v1 path the adapter calls
tools:
  - name: monitor_backend_health
    description: "Agent Team backend health + agent execution mode (real_llm vs mock)."
    min_role: viewer
    method: GET
    path: /api/v1/health

  - name: monitor_list_requests
    description: "List Agent Team requests (newest first). Optional filters: status, project_id, per_page."
    min_role: viewer
    method: GET
    path: /api/v1/requests

  - name: monitor_get_request
    description: "Full detail for one request: status, subtasks/stories, project, timings. Arg: request_id."
    min_role: viewer
    method: GET
    path: /api/v1/requests/{request_id}

  - name: monitor_list_projects
    description: "List projects (optionally include archived)."
    min_role: viewer
    method: GET
    path: /api/v1/projects

  - name: monitor_get_project
    description: "Project detail: status, build-plan rollup, settings. Arg: project_id."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}

  - name: monitor_get_costs
    description: "Token/cost rollups across the platform, or scoped to one project (arg: project_id)."
    min_role: viewer
    method: GET
    path: /api/v1/cost/dashboard

  - name: monitor_recent_failures
    description: "Recently failed requests (status=failed), newest first. Arg: per_page."
    min_role: viewer
    method: GET
    path: /api/v1/requests

  - name: monitor_deploy_health
    description: "Latest deploy health verdict (HEALTHY / UNHEALTHY / unknown) + deployment id/step."
    min_role: viewer
    method: GET
    path: /api/v1/ops/latest

  - name: monitor_team_status
    description: "The 9 agents: resolved/assigned model, override state, tool count, and which are currently busy."
    min_role: viewer
    method: GET
    path: /api/v1/agents

  # ── HAI-43 — lifecycle read companions (review between gated steps) ──
  - name: project_get_prd
    description: "The project's current PRD (latest version). Arg: project_id."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/prd

  - name: project_get_apispec
    description: "The project's current API specification (latest version). Arg: project_id."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/api-spec

  - name: project_get_buildplan
    description: "The project's build-plan rollup (epics -> features -> tasks + counts). Arg: project_id."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/build-plan/rollup

  - name: project_get_tasks
    description: "The project's generated task list (the unit auto-dispatch acts on). Arg: project_id."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/tasks

  # ── HAI-60 — proposal queue read companions (viewer-tier) ────────────────────
  # Let Hermes report on proposals it (or anyone) created — so after a propose_*
  # call it can answer "is my project request approved yet?". Reads only.
  - name: monitor_list_proposals
    description: "List governed proposals (newest first). Optional filters: status (pending/confirmed/rejected/expired), action_type, proposed_by."
    min_role: viewer
    method: GET
    path: /api/v1/proposals

  - name: monitor_get_proposal
    description: "Full detail + current status of one proposal. Arg: proposal_id."
    min_role: viewer
    method: GET
    path: /api/v1/proposals/{proposal_id}

  # ── HAI-61/65 — gated ACTION tools (developer-tier) ──────────────────────────
  # Named for natural language so a local model routes "create a project" →
  # create_project. These are the ONLY way Hermes can change platform state, and
  # they don't change it directly: each files a governed proposal via
  # POST /api/v1/proposals. Whether it runs immediately or waits for a human in
  # /approvals is the backend auto-approve policy (PROPOSAL_REQUIRE_APPROVAL). The
  # service-token write-block (FR-015a) guarantees a token can reach no other
  # mutating endpoint, so a token can never bypass the gate; and `deploy` (or
  # anything else listed in the policy) always needs a human.
  - name: create_project
    description: "Create a new project. Args: name (required), description (optional). Files a governed proposal; runs immediately or awaits approval per policy."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: set_project_brief
    description: "Set a project's brief/description for the first time. Args: project_id (required), content (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  # Alias of set_project_brief for natural 'update/revise the description' phrasing
  # — same governed action (project.brief.set just overwrites the content).
  - name: update_project_description
    description: "Update or revise a project's description (overwrites the existing one). Args: project_id (required), content (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_prd
    description: "Generate (create) the project's PRD. Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_api_spec
    description: "Generate (create) the project's API specification. Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_epics
    description: "Generate the project's epics. Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_features
    description: "Generate features for the project, optionally scoped to one epic. Args: project_id (required), epic_id (optional)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_tasks
    description: "Generate the project's task list. Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: generate_build_plan
    description: "Generate the project's build plan (epics -> features -> tasks rollup). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: dispatch_tasks
    description: "Dispatch the project's tasks to the agents to start building. Args: project_id (required), task_ids (optional list; omit to dispatch all dispatchable tasks)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: submit_request
    description: "Submit a work request to the agent team. Args: description (required), task_type (default feature_request), priority (default medium), project_id (optional)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  # ── HAI-66 — finalize actions (save the artifact to disk + GitHub) ───────────
  - name: finalize_prd
    description: "Finalize the project's PRD and save it to the local machine (+ GitHub). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: finalize_api_spec
    description: "Finalize the project's API spec and save it to the local machine (+ GitHub). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: finalize_tasks
    description: "Finalize the project's task list and save it to the local machine (+ GitHub). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: finalize_epics
    description: "Finalize all of the project's epics (cascades to their features + tasks). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  - name: finalize_features
    description: "Finalize all of the project's features (cascades to their tasks). Arg: project_id (required)."
    min_role: developer
    method: POST
    path: /api/v1/proposals

  # ── HAI-66 — startable-task reads (viewer-tier) ──────────────────────────────
  - name: get_startable_tasks
    description: "The first set of tasks that can be started now for a project (all dependencies satisfied). Arg: project_id (required)."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/tasks/startable

  - name: get_next_wave_tasks
    description: "The next set of tasks that become startable after the current set finishes (one dependency layer ahead). Arg: project_id (required)."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/tasks/next-wave

  # ── BUG-7 — epic/feature enumeration (so generate_features can target an epic)
  - name: get_epics
    description: "List the project's epics (id, title, ordinal) — use this to find an epic_id to target with generate_features. Arg: project_id (name or id)."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/epics

  - name: get_features
    description: "List the project's features (flat; each has its epic_id). Arg: project_id (name or id)."
    min_role: viewer
    method: GET
    path: /api/v1/projects/{project_id}/features
