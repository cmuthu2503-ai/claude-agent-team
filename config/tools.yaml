tools:
  file_read:
    description: "Read file contents from the project directory"
    category: core
    available_to: [all]

  file_write:
    description: "Create or modify files within the project directory"
    category: core
    available_to:
      - prd_specialist
      - user_story_author
      - backend_specialist
      - frontend_specialist
      - devops_specialist
      - tester_specialist

  search_replace:
    description: "Surgical single-occurrence edit on an existing file — use for small changes to large files instead of re-emitting whole content (avoids ~470-line output ceiling)"
    category: core
    available_to:
      - backend_specialist
      - frontend_specialist
      - tester_specialist

  git_operations:
    description: "Git status, diff, commit, branch, push operations"
    category: core
    available_to:
      - code_reviewer
      - backend_specialist
      - frontend_specialist
      - devops_specialist
      - tester_specialist

  github_api:
    description: "Create issues, manage labels, list PRs, repo operations"
    category: github
    available_to:
      - user_story_author
      - code_reviewer
      - devops_specialist

  github_pr_review:
    description: "Review pull requests, post line comments, approve or request changes"
    category: github
    available_to:
      - code_reviewer

  code_exec:
    description: "Execute code in a sandboxed environment (tests, scripts)"
    category: development
    available_to:
      - backend_specialist
      - frontend_specialist
      - tester_specialist

  code_analysis:
    description: "Static analysis, linting, formatting checks (read-only)"
    category: quality
    available_to:
      - code_reviewer
      - backend_specialist
      - frontend_specialist

  coverage_report:
    description: "Generate and read code coverage reports"
    category: quality
    available_to:
      - code_reviewer
      - tester_specialist

  test_runner:
    description: "Execute test suites (unit, integration, E2E)"
    category: testing
    available_to:
      - tester_specialist
      - backend_specialist
      - frontend_specialist

  deployment:
    description: "Docker Compose deploy, rollback, health check operations"
    category: infrastructure
    available_to:
      - devops_specialist

  ci_cd_pipeline:
    description: "Create and manage GitHub Actions workflows"
    category: infrastructure
    available_to:
      - devops_specialist

  monitoring:
    description: "Read health check endpoints and deployment status"
    category: infrastructure
    available_to:
      - devops_specialist

  database_operations:
    description: "Database schema management, migrations, seed data"
    category: database
    available_to:
      - backend_specialist

  web_search:
    description: "Search the web via Firecrawl. Returns top N results with scraped markdown content. Use for current news, pricing, versions, market data."
    category: research
    available_to: [all]

  web_scrape:
    description: "Deep-read a single URL via Firecrawl. Returns clean markdown of the full page. Use for known URLs (e.g., a vendor's docs or pricing page)."
    category: research
    available_to: [all]

  wait_for_deployment:
    description: "Block until the standalone deployment supervisor reaches a terminal state for the current request (completed / failed / rolled_back / on_hold). Returns the full deployment_states row including the judge's strategy + reasoning. ONLY for devops_specialist — its sole tool for observing the supervisor's real-world deployment work."
    category: infrastructure
    available_to:
      - devops_specialist

  lessons_writer:
    description: "Read from or append to docs/agent-lessons-learned.md — the shared failure-pattern knowledge base injected into every code-producing agent's system prompt. Use action='read' to check existing lessons, action='append' to persist a new lesson block so future agents avoid the same mistake."
    category: quality
    available_to:
      - self_learning_agent

  security_scan:
    description: "Run SAST (bandit), Python dependency CVE scan (safety), frontend dependency audit (npm audit), and secrets detection (detect-secrets) against generated project files. Returns structured results with verdict=PASS or verdict=FAIL. FAIL if any CRITICAL/HIGH finding or any secret is detected."
    category: security
    available_to:
      - security_specialist

  ops_check:
    description: "Post-deploy health monitoring: HTTP health endpoint checks (:8000/:3000), disk usage, memory pressure (/proc/meminfo), and recent error log scan. Use action='full_check' for a combined verdict. Returns verdict=HEALTHY/DEGRADED/UNHEALTHY."
    category: infrastructure
    available_to:
      - ops_heal_agent

  policy_check:
    description: "Evaluate the declarative quality rule catalog (config/quality-rules.yaml) against a batch of agent emissions. Each emission is {target_path, content, agent_id, tool_name, rework_cycle}. Returns {verdict, violations[], summary{}}. verdict='BLOCK' when any enforce-severity rule fires (workflow halts at quality_guardian_approval gate); 'PASS_WITH_WARNINGS' when only warn-severity rules fire (workflow advances with annotated quality_report); 'PASS' when nothing fires. Each violation carries rule_id, rationale, fix_hint, and a snippet of the matched content so the next rework cycle has actionable guidance."
    category: quality
    available_to:
      - quality_guardian
