teams:
  engineering:
    display_name: "Engineering"
    lead: business_analyst
    sub_teams: [planning, development, delivery]
    # self_learning_agent is cross-cutting — not scoped to one sub-team
    members: [self_learning_agent]
    domain: [all]

  planning:
    display_name: "Planning Team"
    lead: business_analyst
    members: [business_analyst, project_orchestrator]
    domain: [requirements, documentation, user-stories, acceptance-criteria]
    parent_team: engineering

  development:
    display_name: "Development Team"
    lead: code_reviewer
    members: [code_reviewer, backend_specialist, frontend_specialist, architecture_reviewer]
    domain: [backend, frontend, api, database, ui, components, code-review]
    parent_team: engineering

  delivery:
    display_name: "Delivery Team"
    lead: devops_specialist
    members: [devops_specialist, tester_specialist, security_specialist, quality_guardian, ops_heal_agent]
    domain: [testing, deployment, ci-cd, infrastructure, monitoring, e2e, security, quality, operations]
    parent_team: engineering

  research:
    display_name: "Research Team"
    lead: research_specialist
    members: [research_specialist]
    domain: [research, analysis, assessment, comparison, evaluation]
    parent_team: engineering

  content:
    display_name: "Content Team"
    lead: content_creator
    members: [content_creator]
    domain: [presentation, documentation, content, writing, slides, guide, tutorial]
    parent_team: engineering

hierarchy:
  root: engineering
  delegation_direction: top_down
