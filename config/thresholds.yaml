thresholds:

  # ── Code Quality ──────────────────────────────
  code_coverage_minimum:
    value: 80
    unit: percent
    enforcement: block_merge
    description: "Minimum code coverage required on every PR"

  review_sla:
    value: 24
    unit: hours
    enforcement: alert
    description: "Maximum time for code review after PR submission"

  review_approval_required:
    value: true
    enforcement: block_merge
    description: "At least one approval required before merge"

  arch_review_approval:
    value: true
    enforcement: block_merge
    description: "Architecture review must find no CRITICAL violations before merge"

  no_critical_vulnerabilities:
    value: true
    enforcement: block_merge
    description: "Security scan must find no CRITICAL or HIGH vulnerabilities before merge"

  no_secrets_detected:
    value: true
    enforcement: block_merge
    description: "No hard-coded secrets or credentials may be present in committed code"

  # AET-20 — single threshold the AE-4 security gate (AET-21) reads to
  # decide which severities cause BLOCK vs PASS_WITH_WARNINGS. Applies
  # uniformly across all four security tools (secret_scan, sast_scan,
  # dependency_audit, pen_test_simple) so the agent's tools, the
  # workflow runner, and the UI all use the same cutoff (L21 single
  # source of truth for cross-layer labels).
  #
  # Severity ordering (worst → best): critical > high > medium > low > info.
  # Setting value=high means findings of severity critical OR high
  # cause BLOCK; medium/low are reported but advance the workflow.
  # Tighten to "medium" for regulated environments; loosen to "critical"
  # for proof-of-concept work where false positives are expensive.
  security_max_severity_to_block:
    value: high
    options: [critical, high, medium, low]
    enforcement: block_merge
    description: "Highest finding severity that the AE-4 security gate ignores. Findings AT or ABOVE this severity (i.e. as bad or worse) cause BLOCK; below cause PASS_WITH_WARNINGS. Default 'high' blocks on critical+high, warns on medium+low."

  # AET-35 — severity cutoff for the architecture review stage gate.
  # The architecture_reviewer agent (AET-34 prompt) emits findings at
  # two severities:
  #   - CRITICAL — rules 1-3 (DB-in-routes, unregistered handler,
  #                unrouted page). Real structural breakage.
  #   - HIGH     — rules 4-6 (Pydantic v1 patterns, circular imports
  #                that don't break the build, config-system gaps).
  #                Quality signals, not breakage.
  #
  # Default cutoff = 'critical' so the gate blocks ONLY on CRITICAL
  # findings — matches the agent's own ARCH_VIOLATION verdict logic
  # (the audit at docs/arch-reviewer-audit.md §3 R3 recommended this).
  # Tighten to 'high' for projects that want HIGH findings to gate
  # too (e.g. v1→v2 Pydantic migration enforced via the workflow).
  # Below 'critical' is intentionally NOT supported — there's no
  # arch-finding severity below HIGH.
  arch_review_block_severity:
    value: critical
    options: [critical, high]
    enforcement: block_merge
    description: "Severity cutoff for the architecture review stage gate. Findings AT or ABOVE this severity cause ARCH_VIOLATION (block). Default 'critical' blocks only on rules 1-3 violations (DB bypass, unregistered handler, unrouted page). Tighten to 'high' to also block on Pydantic v1 / circular-import / config-system findings."

  quality_guardian_approval:
    value: true
    enforcement: block_merge
    description: "Quality Guardian must not ESCALATE (API contract mismatch, missing traceability, or known failure patterns are CRITICAL blockers)"

  max_review_cycles:
    value: 3
    enforcement: escalate
    description: "Maximum review iterations before escalating"

  # ── Deployment ────────────────────────────────
  deployment_frequency:
    value: weekly
    options: [daily, weekly, biweekly, monthly]
    enforcement: scheduled
    description: "Target deployment cadence"

  smoke_test_pass_rate:
    value: 100
    unit: percent
    enforcement: block_promotion
    description: "All smoke tests must pass to promote staging to production"

  health_check_pass_rate:
    value: 100
    unit: percent
    enforcement: auto_rollback
    description: "All health checks must pass after production deployment"

  health_check_retries:
    value: 3
    enforcement: auto_rollback
    description: "Consecutive health check failures before triggering rollback"

  # ── Demo ──────────────────────────────────────
  demo_test_frequency:
    value: weekly
    enforcement: cron
    cron_expression: "0 9 * * 1"
    description: "How often demo tests run (Monday 9am)"

  # ── Task Management ───────────────────────────
  stale_branch_age:
    value: 7
    unit: days
    enforcement: automated_cleanup
    description: "Delete branches merged longer than this"

  max_concurrent_tasks_per_agent:
    value: 3
    enforcement: queue
    description: "Maximum parallel tasks any single agent handles"

  task_timeout:
    value: 300
    unit: seconds
    enforcement: cancel_with_partial_results
    description: "Maximum time for a single agent task before timeout"

  # ── Testing ───────────────────────────────────
  test_pass_rate:
    value: 100
    unit: percent
    enforcement: block_deploy
    description: "All tests must pass before deployment"

  regression_check:
    value: true
    enforcement: block_deploy
    description: "No regressions detected in test suite"

# ── Cost & Token Management ─────────────────────
# See cross-cutting-concerns.md Area 4.
#
# Pricing is denominated in USD per million tokens. Real billing flows through
# AWS Marketplace in Claude Consumption Units (CCUs) — these values are used
# for in-app cost estimation only.
#
# US inference_geo is the default (see config/project.yaml::llm.inference_geo),
# which adds a 1.1× multiplier to base Claude Platform on AWS pricing. We bake
# that 10% premium into the numbers below so the dashboard matches your bill.
# If you flip inference_geo to "global", divide these by 1.1 (or just accept
# the small over-estimate).
cost:
  # ── PAM-28 — DEPRECATED PRICING SOURCE ─────────────────────────────
  #
  # As of PAM-15 (2026-05), the runtime cost calculator
  # (``src/core/token_tracker.py``) reads pricing from
  # ``config/models.yaml`` FIRST — each entry in that catalog carries
  # ``pricing_per_million.{input, output}`` keyed by catalog id. The
  # block below is now the FALLBACK source, consulted only when:
  #
  #   1. the catalog hasn't loaded (boot-time soft-fail path); or
  #   2. a ``token_usage.model`` value isn't a catalog id and doesn't
  #      resolve through the catalog's legacy alias map (e.g. an old
  #      persisted row from a model that's since been removed).
  #
  # New models should be priced ONLY in ``config/models.yaml``. Adding
  # them here too creates a drift surface where the dashboard can show
  # one cost and the cost dashboard another. The legacy entries below
  # are kept so historical ``token_usage`` rows still resolve to a
  # price — do not extend them. When all historical rows have either
  # been re-attributed (PR-5 future work) or aged out, this whole
  # block can be deleted.
  #
  # See ``docs/prd-per-agent-model-assignment.md`` §6 (Phase 5) for
  # the migration plan.
  pricing:                             # USD per million tokens (1.1× US-geo multiplier baked in)
    claude-opus-4-7:
      input: 16.50                     # 15.00 × 1.1
      output: 82.50                    # 75.00 × 1.1
    # Legacy entries kept so old token_usage rows still resolve to a price.
    claude-opus-4-6:
      input: 16.50
      output: 82.50
    claude-sonnet-4-6:
      input: 3.30
      output: 16.50
  budget:
    # Bumped 5× from the original $50/$500 because Opus 4.7 across all 9 agents
    # is roughly 5× the per-token spend of the prior mixed Sonnet/Opus setup.
    daily_limit_usd: 250.00
    monthly_limit_usd: 2500.00
    per_request_limit_usd: 50.00
    alert_threshold_pct: 0.80

# ── Testing Strategy ────────────────────────────
# See cross-cutting-concerns.md Area 6
testing:
  unit_coverage_min: 80              # percent
  tier2_cassette_match: strict       # strict | flexible
  tier3_eval_threshold: 0.75         # minimum eval score to pass
  tier3_schedule: weekly             # weekly | per-release | manual

# ── Backup ──────────────────────────────────────
# See cross-cutting-concerns.md Area 7
backup:
  schedule: daily                    # daily | hourly
  retention_days: 30
  path: "/app/backups"
